name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The Android SDK is preinstalled on the runner and picked up through
      # ANDROID_HOME, so no local.properties is needed here.
      - name: Unit tests
        run: ./gradlew :fsrs:test :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kanji-practice-debug
          path: app/build/outputs/apk/debug/app-debug.apk
