name: Release

# Tag a commit to publish sideloadable APKs for both apps:
#   git tag v2.1.0 && git push origin v2.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to attach the APKs to'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          ./gradlew :fsrs:test \
            :app:testJapaneseDebugUnitTest :app:testChineseDebugUnitTest

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. A release signed with a"
            echo "::error::different key cannot be installed over an existing one,"
            echo "::error::so this build will not fall back to another key."
            echo "::error::See README, 'Publishing a release'."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks

      # Without a stable key Android refuses to install an update over an
      # existing install, so the key is required rather than optional.
      - name: Build release APKs
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleJapaneseRelease :app:assembleChineseRelease

      - name: Verify the APKs are signed
        run: |
          for apk in app/build/outputs/apk/japanese/release/app-japanese-release.apk \
                     app/build/outputs/apk/chinese/release/app-chinese-release.apk; do
            echo "$apk"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$apk" | head -1
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/japanese/release/app-japanese-release.apk
            app/build/outputs/apk/chinese/release/app-chinese-release.apk
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
